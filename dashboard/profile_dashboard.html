<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Vision diagnostics</title></head>
<body><main><h1>Vision diagnostics</h1><pre id="status">loading</pre></main>
<script>
fetch('/health').then(response => response.json()).then(value => {
  document.getElementById('status').textContent = JSON.stringify(value, null, 2);
}).catch(error => { document.getElementById('status').textContent = String(error); });
</script>
</body>
</html>
