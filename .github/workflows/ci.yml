name: 视觉持续集成

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: 下载完整锁定 wheel 闭包
        run: >-
          python -m pip download --only-binary=:all: --require-hashes
          --dest wheelhouse -r requirements.txt
      - name: 离线安装并校验锁定闭包
        run: |
          python -m pip install --no-index --find-links wheelhouse --require-hashes -r requirements.txt
          python scripts/dependency_lock.py --wheelhouse wheelhouse --python python
      - run: python -m pytest -q
      - run: python -m py_compile app.py run_vision_server.py vision/*.py scripts/*.py
      - run: python -c "from vision.model_manifest import verify_model_manifest; result=verify_model_manifest(); assert result['ok'], result"

  windows-test:
    name: Windows 完整测试
    timeout-minutes: 30
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: 下载完整锁定 wheel 闭包
        run: >-
          python -m pip download --only-binary=:all: --require-hashes
          --dest wheelhouse -r requirements.txt
      - name: 离线安装并校验锁定闭包
        run: |
          python -m pip install --no-index --find-links wheelhouse --require-hashes -r requirements.txt
          python scripts/dependency_lock.py --wheelhouse wheelhouse --python python --target-sys-platform win32
      - name: 运行完整测试
        run: python -m pytest -q
      - name: 校验 Python 源码
        run: python -m py_compile app.py run_vision_server.py vision/*.py scripts/*.py
      - name: 校验生产模型清单
        run: python -c "from vision.model_manifest import verify_model_manifest; result=verify_model_manifest(); assert result['ok'], result"

  windows-package:
    name: Windows 交付包构建
    timeout-minutes: 45
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: 下载完整锁定 wheel 闭包
        run: >-
          python -m pip download --only-binary=:all: --require-hashes
          --dest wheelhouse -r requirements.txt
      - name: 离线安装并校验锁定闭包
        run: |
          python -m pip install --no-index --find-links wheelhouse --require-hashes -r requirements.txt
          python scripts/dependency_lock.py --wheelhouse wheelhouse --python python --target-sys-platform win32
      - name: 物化精确 AI wheel 闭包
        run: >-
          python scripts/materialize_ai_wheelhouse.py
          --descriptor requirements-ai.lock.json
          --runtime-descriptor ai-runtime-descriptor.json
          --destination ai-wheelhouse
      - name: 构建并验证 Windows runtime 与录播交付包
        shell: pwsh
        run: |
          ./scripts/build_exe.ps1 -Wheelhouse (Join-Path $PWD "wheelhouse") -AiWheelhouse (Join-Path $PWD "ai-wheelhouse") -AiWheelhouseDescriptor (Join-Path $PWD "requirements-ai.lock.json")
          & (Join-Path $PWD ".venv-packaging-core\Scripts\python.exe") scripts/verify_packaged_exe.py
          ./scripts/package_main_artifacts.ps1 -Commit "${{ github.sha }}" -OutputDirectory (Join-Path $PWD "main-artifacts")
          $worker = Join-Path $PWD "build/dist-ai/vending-vision-ai-worker"
          $patch = Join-Path $PWD "build/ai-worker-vm-patch"
          New-Item -ItemType Directory -Force (Join-Path $patch "_internal/vision") | Out-Null
          Copy-Item -LiteralPath (Join-Path $worker "vending-vision-ai-worker.exe") -Destination $patch
          foreach ($name in @("official-ai-source-descriptor.json", "regional-evaluator-descriptor.json")) {
            Copy-Item -LiteralPath (Join-Path $worker "_internal/$name") -Destination (Join-Path $patch "_internal/$name")
          }
          foreach ($name in @("ai_attempt_worker.py", "catvton_pose_masks.py", "regional_evaluator.py", "regional_evaluator_provenance.py")) {
            Copy-Item -LiteralPath (Join-Path $worker "_internal/vision/$name") -Destination (Join-Path $patch "_internal/vision/$name")
          }
      - name: 暂存同提交 Vision artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vending-vision-main-staging-${{ github.sha }}
          path: main-artifacts/*
          if-no-files-found: error
      - name: 暂存 VM AI worker 热补丁
        uses: actions/upload-artifact@v4
        with:
          name: vending-vision-ai-worker-patch-${{ github.sha }}
          path: build/ai-worker-vm-patch/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: 生成同提交候选交付包（供 VM 验收）
        shell: pwsh
        run: |
          $candidateDir = Join-Path $PWD "candidate-artifacts"
          New-Item -ItemType Directory -Force -Path $candidateDir | Out-Null
          & (Join-Path $PWD ".venv-packaging-core\Scripts\python.exe") scripts/candidate_artifact_manifest.py `
            --dist-root (Join-Path $PWD "dist") `
            --artifact (Join-Path $candidateDir "vending-vision-${{ github.sha }}.zip") `
            --manifest-output (Join-Path $candidateDir "candidate-manifest.json") `
            --source-commit "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "candidate delivery generation failed" }
      - name: 暂存同提交候选交付包
        uses: actions/upload-artifact@v4
        with:
          name: vending-vision-candidate-${{ github.sha }}
          path: candidate-artifacts/*
          if-no-files-found: error

  regional-evidence-contract:
    name: VEM 区域证据合同
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Checkout pinned VEM regional evidence contract
        uses: actions/checkout@v4
        with:
          repository: YKDZ/vem
          ref: 2dad5d56e752b2a0d19167bc0a6e32871ef3587e
          path: vem-contract
          sparse-checkout: |
            scripts/testbed/ai-regional-evidence.mjs
            scripts/testbed/ai-regional-evidence-policy.json
          sparse-checkout-cone-mode: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: 下载完整锁定 wheel 闭包
        run: >-
          python -m pip download --only-binary=:all: --require-hashes
          --dest wheelhouse -r requirements.txt
      - name: 离线安装并校验锁定闭包
        run: |
          python -m pip install --no-index --find-links wheelhouse --require-hashes -r requirements.txt
          python scripts/dependency_lock.py --wheelhouse wheelhouse --python python
      - name: 验证 Vision 区域证据与固定 VEM 合同
        env:
          VEM_REGIONAL_EVIDENCE_MODULE: ${{ github.workspace }}/vem-contract/scripts/testbed/ai-regional-evidence.mjs
        run: >-
          python -m pytest -q
          tests/test_ai_attempt_worker_boundary.py::test_worker_customer_attempt_runs_catvton_pipeline_and_writes_private_png

  publish-main-artifacts:
    name: 发布同提交 Vision artifacts
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    needs:
      - test
      - windows-test
      - regional-evidence-contract
      - windows-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vending-vision-main-staging-${{ github.sha }}
          path: main-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: vending-vision-main-${{ github.sha }}
          path: main-artifacts/*
          if-no-files-found: error
