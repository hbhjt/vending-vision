name: Trusted pre-cutover companion builder

on:
  workflow_call:
    inputs:
      core_wheelhouse_url:
        description: Immutable HTTPS URL for the core Windows wheelhouse archive
        required: true
        type: string
      core_wheelhouse_sha256:
        description: Expected SHA-256 for the core wheelhouse archive
        required: true
        type: string
      core_wheelhouse_bytes:
        description: Exact byte size for the core wheelhouse archive
        required: true
        type: number
    outputs:
      artifact_name:
        description: Actions artifact containing the independent companion evidence
        value: ${{ jobs.build.outputs.artifact_name }}
      archive_file:
        description: Independent companion archive filename
        value: ${{ jobs.build.outputs.archive_file }}
      archive_sha256:
        description: Independent companion archive SHA-256
        value: ${{ jobs.build.outputs.archive_sha256 }}
      descriptor_file:
        description: Canonical exact-file descriptor filename
        value: ${{ jobs.build.outputs.descriptor_file }}
      descriptor_sha256:
        description: Canonical exact-file descriptor SHA-256
        value: ${{ jobs.build.outputs.descriptor_sha256 }}
      attestation_bundle_file:
        description: GitHub build-provenance bundle filename
        value: ${{ jobs.build.outputs.attestation_bundle_file }}
      attestation_bundle_sha256:
        description: GitHub build-provenance bundle SHA-256
        value: ${{ jobs.build.outputs.attestation_bundle_sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_name: ${{ steps.evidence.outputs.artifact_name }}
      archive_file: ${{ steps.evidence.outputs.archive_file }}
      archive_sha256: ${{ steps.evidence.outputs.archive_sha256 }}
      descriptor_file: ${{ steps.evidence.outputs.descriptor_file }}
      descriptor_sha256: ${{ steps.evidence.outputs.descriptor_sha256 }}
      attestation_bundle_file: ${{ steps.evidence.outputs.attestation_bundle_file }}
      attestation_bundle_sha256: ${{ steps.evidence.outputs.attestation_bundle_sha256 }}
    steps:
      - name: Checkout immutable companion source
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted-companion
          persist-credentials: false
      - name: Verify exact trusted builder source closure
        shell: pwsh
        run: |
          python -I trusted-companion/scripts/verify_trusted_builder_closure.py --root trusted-companion --manifest trusted-companion/trusted-precutover-companion-builder-closure.json
          if ($LASTEXITCODE -ne 0) { throw "trusted builder source closure verification failed" }
      - uses: actions/setup-python@v5
        with:
          python-version-file: trusted-companion/.python-version
          cache: pip
      - name: Validate trusted identity and materialize core wheelhouse
        shell: pwsh
        env:
          CORE_WHEELHOUSE_URL: ${{ inputs.core_wheelhouse_url }}
          CORE_WHEELHOUSE_SHA256: ${{ inputs.core_wheelhouse_sha256 }}
          CORE_WHEELHOUSE_BYTES: ${{ inputs.core_wheelhouse_bytes }}
          TRUSTED_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_SHA: ${{ job.workflow_sha }}
        run: |
          if ($env:TRUSTED_REPOSITORY -cne "hbhjt/vending-vision") { throw "unexpected companion repository" }
          if ($env:TRUSTED_SHA -notmatch '^[a-f0-9]{40}$') { throw "trusted companion SHA is unavailable" }
          if ($env:CORE_WHEELHOUSE_URL -notmatch '^https://') { throw "core wheelhouse URL must be HTTPS" }
          if ($env:CORE_WHEELHOUSE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw "core wheelhouse SHA-256 is invalid" }
          if ($env:CORE_WHEELHOUSE_BYTES -notmatch '^[1-9][0-9]*$') { throw "core wheelhouse byte size is invalid" }
          python trusted-companion/scripts/download_verified_archive.py --url $env:CORE_WHEELHOUSE_URL --sha256 $env:CORE_WHEELHOUSE_SHA256 --expected-bytes $env:CORE_WHEELHOUSE_BYTES --destination core-wheelhouse --total-timeout-seconds 1800
          if ($LASTEXITCODE -ne 0) { throw "core wheelhouse materialization failed" }
          "TRUSTED_COMPANION_SHA=$env:TRUSTED_SHA" >> $env:GITHUB_ENV
      - name: Build only the self-contained companion in an isolated environment
        shell: pwsh
        run: |
          python -m venv companion-env
          $python = Join-Path $PWD "companion-env/Scripts/python.exe"
          & $python -m pip install --disable-pip-version-check --no-index --find-links core-wheelhouse --require-hashes -r trusted-companion/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "companion build environment failed" }
          & $python trusted-companion/scripts/dependency_lock.py --requirements-lock trusted-companion/requirements.txt --wheelhouse core-wheelhouse --python $python --target-sys-platform win32
          if ($LASTEXITCODE -ne 0) { throw "companion dependency closure failed" }
          & $python -m PyInstaller --clean --noconfirm --workpath build/work --distpath build/dist trusted-companion/vending_vision_precutover_verifier.spec
          if ($LASTEXITCODE -ne 0) { throw "companion PyInstaller build failed" }
          $entry = Join-Path $PWD "build/dist/vending-vision-precutover-verifier/vending-vision-precutover-verifier.exe"
          & $entry --help
          if ($LASTEXITCODE -ne 0) { throw "frozen companion is not callable" }
          New-Item -ItemType Directory -Force trusted-output | Out-Null
          $pythonVersion = (& $python -c "import platform; print(platform.python_version())").Trim()
          $pyinstallerVersion = (& $python -c "import PyInstaller; print(PyInstaller.__version__)").Trim()
          & $python trusted-companion/scripts/precutover_companion_descriptor.py build --root build/dist/vending-vision-precutover-verifier --source-commit $env:TRUSTED_COMPANION_SHA --python-version $pythonVersion --pyinstaller-version $pyinstallerVersion --runner-image $env:ImageOS --runner-image-version $env:ImageVersion --descriptor-output trusted-output/precutover-companion-descriptor.json --archive-output trusted-output/vending-vision-precutover-verifier.zip
          if ($LASTEXITCODE -ne 0) { throw "companion descriptor build failed" }
          $archiveSha = (Get-FileHash trusted-output/vending-vision-precutover-verifier.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $descriptorSha = (Get-FileHash trusted-output/precutover-companion-descriptor.json -Algorithm SHA256).Hash.ToLowerInvariant()
          & $python trusted-companion/scripts/precutover_companion_descriptor.py verify --archive trusted-output/vending-vision-precutover-verifier.zip --destination build/verified --expected-sha256 $archiveSha --expected-descriptor-sha256 $descriptorSha
          if ($LASTEXITCODE -ne 0) { throw "companion archive verification failed" }
          "TRUSTED_COMPANION_ARCHIVE=$PWD/trusted-output/vending-vision-precutover-verifier.zip" >> $env:GITHUB_ENV
      - name: Attest only the verified independent companion
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.TRUSTED_COMPANION_ARCHIVE }}
      - name: Record externally bindable companion evidence
        id: evidence
        shell: pwsh
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $archiveFile = "vending-vision-precutover-verifier.zip"
          $descriptorFile = "precutover-companion-descriptor.json"
          $bundleFile = "precutover-companion-provenance.sigstore.json"
          if ($env:ATTESTATION_BUNDLE_PATH -notmatch '\S') { throw "companion attestation bundle missing" }
          Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE_PATH -Destination "trusted-output/$bundleFile"
          $archiveSha = (Get-FileHash "trusted-output/$archiveFile" -Algorithm SHA256).Hash.ToLowerInvariant()
          $descriptorSha = (Get-FileHash "trusted-output/$descriptorFile" -Algorithm SHA256).Hash.ToLowerInvariant()
          $bundleSha = (Get-FileHash "trusted-output/$bundleFile" -Algorithm SHA256).Hash.ToLowerInvariant()
          "artifact_name=vending-vision-precutover-$env:TRUSTED_COMPANION_SHA" >> $env:GITHUB_OUTPUT
          "archive_file=$archiveFile" >> $env:GITHUB_OUTPUT
          "archive_sha256=$archiveSha" >> $env:GITHUB_OUTPUT
          "descriptor_file=$descriptorFile" >> $env:GITHUB_OUTPUT
          "descriptor_sha256=$descriptorSha" >> $env:GITHUB_OUTPUT
          "attestation_bundle_file=$bundleFile" >> $env:GITHUB_OUTPUT
          "attestation_bundle_sha256=$bundleSha" >> $env:GITHUB_OUTPUT
      - name: Upload only companion artifact and provenance
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: trusted-output/*
          if-no-files-found: error
          retention-days: 14
