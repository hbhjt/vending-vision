name: 发布实验性视觉候选版本

on:
  push:
    tags:
      - "v*.*.*-rc.*"

permissions:
  contents: read

jobs:
  trusted_builder:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: hbhjt/vending-vision/.github/workflows/trusted-ai-candidate-builder.yml@691b5056e8b9bf2667bc527b2170780b05863946
    with:
      source_commit: ${{ github.sha }}
      core_wheelhouse_url: ${{ vars.CORE_WHEELHOUSE_URL }}
      core_wheelhouse_sha256: ${{ vars.CORE_WHEELHOUSE_SHA256 }}
      core_wheelhouse_bytes: ${{ fromJSON(vars.CORE_WHEELHOUSE_BYTES) }}

  verify:
    needs: trusted_builder
    runs-on: windows-latest
    permissions:
      contents: read
      attestations: read
    outputs:
      artifact_name: ${{ needs.trusted_builder.outputs.artifact_name }}
      artifact_file: ${{ needs.trusted_builder.outputs.artifact_file }}
      subject_sha256: ${{ needs.trusted_builder.outputs.subject_sha256 }}
      manifest_sha256: ${{ needs.trusted_builder.outputs.manifest_sha256 }}
      attestation_bundle_file: ${{ needs.trusted_builder.outputs.attestation_bundle_file }}
      attestation_bundle_sha256: ${{ needs.trusted_builder.outputs.attestation_bundle_sha256 }}
      builder_evidence_file: ${{ needs.trusted_builder.outputs.builder_evidence_file }}
    steps:
      - name: Checkout immutable verifier implementation
        uses: actions/checkout@v4
        with:
          repository: hbhjt/vending-vision
          ref: 59b4fee088db08f3008c137409f98577de987595
          path: trusted-verifier
          persist-credentials: false
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          repository: hbhjt/vending-vision
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.trusted_builder.outputs.artifact_name }}
          path: candidate-input
      - name: Verify trusted reusable-builder provenance before extraction
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_FILE: ${{ needs.trusted_builder.outputs.artifact_file }}
          ATTESTATION_BUNDLE_FILE: ${{ needs.trusted_builder.outputs.attestation_bundle_file }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if ($env:ARTIFACT_FILE -notmatch '^vending-vision-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+-windows-x86_64\.zip$') { throw "candidate artifact file output is invalid" }
          if ($env:ATTESTATION_BUNDLE_FILE -cne "github-build-provenance.sigstore.json") { throw "attestation bundle file output is invalid" }
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:SOURCE_REF -notmatch '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+$') { throw "candidate source event identity is invalid" }
          $artifact = Join-Path $PWD "candidate-input/$env:ARTIFACT_FILE"
          $bundle = Join-Path $PWD "candidate-input/$env:ATTESTATION_BUNDLE_FILE"
          gh attestation verify $artifact --bundle $bundle --repo "hbhjt/vending-vision" --signer-workflow "hbhjt/vending-vision/.github/workflows/trusted-ai-candidate-builder.yml" --signer-digest "691b5056e8b9bf2667bc527b2170780b05863946" --source-ref $env:SOURCE_REF --source-digest $env:SOURCE_COMMIT --deny-self-hosted-runners
          if ($LASTEXITCODE -ne 0) { throw "trusted builder attestation verification failed" }
      - uses: actions/setup-python@v5
        with:
          python-version-file: source/.python-version
      - name: Safely extract and run the full candidate verifier
        shell: pwsh
        env:
          CORE_WHEELHOUSE_URL: ${{ vars.CORE_WHEELHOUSE_URL }}
          CORE_WHEELHOUSE_SHA256: ${{ vars.CORE_WHEELHOUSE_SHA256 }}
          CORE_WHEELHOUSE_BYTES: ${{ vars.CORE_WHEELHOUSE_BYTES }}
          ARTIFACT_FILE: ${{ needs.trusted_builder.outputs.artifact_file }}
          SUBJECT_SHA256: ${{ needs.trusted_builder.outputs.subject_sha256 }}
          MANIFEST_SHA256: ${{ needs.trusted_builder.outputs.manifest_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if ($env:ARTIFACT_FILE -notmatch '^vending-vision-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+-windows-x86_64\.zip$') { throw "candidate artifact file output is invalid" }
          if ($env:SUBJECT_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:MANIFEST_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw "candidate verifier output identity is invalid" }
          python trusted-verifier/scripts/download_verified_archive.py --url $env:CORE_WHEELHOUSE_URL --sha256 $env:CORE_WHEELHOUSE_SHA256 --expected-bytes $env:CORE_WHEELHOUSE_BYTES --destination verifier-wheelhouse --total-timeout-seconds 1800
          if ($LASTEXITCODE -ne 0) { throw "verifier wheelhouse materialization failed" }
          python -m venv .venv-candidate-verifier
          $VerifyPython = Join-Path $PWD ".venv-candidate-verifier\Scripts\python.exe"
          & $VerifyPython -m pip install --disable-pip-version-check --no-index --find-links verifier-wheelhouse --require-hashes -r source/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "verifier dependency install failed" }
          $artifact = Join-Path $PWD "candidate-input/$env:ARTIFACT_FILE"
          & $VerifyPython trusted-verifier/scripts/verify_packaged_exe.py --require-ai-worker --candidate-artifact $artifact --trusted-subject-sha256 $env:SUBJECT_SHA256 --expected-embedded-manifest-sha256 $env:MANIFEST_SHA256 --expected-source-commit $env:SOURCE_COMMIT --extract-root (Join-Path $PWD "verified-candidate")
          if ($LASTEXITCODE -ne 0) { throw "fresh candidate verification failed" }

  trusted_signer:
    needs: verify
    permissions:
      contents: read
      attestations: read
    uses: hbhjt/vending-vision/.github/workflows/trusted-ai-candidate-signer.yml@59b4fee088db08f3008c137409f98577de987595
    with:
      source_commit: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      artifact_name: ${{ needs.verify.outputs.artifact_name }}
      subject_sha256: ${{ needs.verify.outputs.subject_sha256 }}
      manifest_sha256: ${{ needs.verify.outputs.manifest_sha256 }}
      attestation_bundle_sha256: ${{ needs.verify.outputs.attestation_bundle_sha256 }}
      signer_identity: ${{ vars.VISION_SUPPLIER_SIGNER_IDENTITY }}

  sign_evidence:
    needs: [verify, trusted_signer]
    runs-on: windows-latest
    environment: experimental-candidate
    permissions:
      contents: read
    outputs:
      signed_evidence_artifact_name: ${{ steps.identities.outputs.signed_evidence_artifact_name }}
      signed_evidence_sha256: ${{ steps.seal.outputs.signed_evidence_sha256 }}
    steps:
      - name: Checkout immutable trusted signing implementation
        uses: actions/checkout@v4
        with:
          repository: hbhjt/vending-vision
          ref: 59b4fee088db08f3008c137409f98577de987595
          path: trusted-signer
          persist-credentials: false
      - name: Validate direct signing identities without shell interpolation
        id: identities
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          UNSIGNED_EVIDENCE_ARTIFACT_NAME: ${{ needs.trusted_signer.outputs.unsigned_evidence_artifact_name }}
          UNSIGNED_EVIDENCE_SHA256: ${{ needs.trusted_signer.outputs.unsigned_evidence_sha256 }}
          VISION_SUPPLIER_SIGNER_IDENTITY: ${{ vars.VISION_SUPPLIER_SIGNER_IDENTITY }}
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw "direct signer source commit is invalid" }
          if ($env:SOURCE_REF -notmatch '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+$') { throw "direct signer source ref is invalid" }
          if ($env:UNSIGNED_EVIDENCE_ARTIFACT_NAME -cne "vending-vision-verified-evidence-$env:SOURCE_COMMIT") { throw "direct signer unsigned evidence artifact is invalid" }
          if ($env:UNSIGNED_EVIDENCE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw "direct signer unsigned evidence digest is invalid" }
          if ($env:VISION_SUPPLIER_SIGNER_IDENTITY -notmatch '^spki-sha256:[a-f0-9]{64}$') { throw "supplier signer identity is invalid" }
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($python)) { throw "trusted system Python path is not absolute" }
          $openssl = "C:\Program Files\Git\mingw64\bin\openssl.exe"
          if (-not (Test-Path -LiteralPath $openssl -PathType Leaf)) { throw "trusted absolute OpenSSL executable is unavailable" }
          "TRUSTED_PYTHON=$python" >> $env:GITHUB_ENV
          "TRUSTED_OPENSSL=$openssl" >> $env:GITHUB_ENV
          "SOURCE_COMMIT=$env:SOURCE_COMMIT" >> $env:GITHUB_ENV
          "UNSIGNED_EVIDENCE_SHA256=$env:UNSIGNED_EVIDENCE_SHA256" >> $env:GITHUB_ENV
          "VISION_SUPPLIER_SIGNER_IDENTITY=$env:VISION_SUPPLIER_SIGNER_IDENTITY" >> $env:GITHUB_ENV
          "signed_evidence_artifact_name=vending-vision-signed-evidence-$env:SOURCE_COMMIT" >> $env:GITHUB_OUTPUT
      - name: Verify immutable trusted signing script hashes
        shell: pwsh
        run: |
          $root = (Resolve-Path -LiteralPath trusted-signer).Path
          $verifier = (Resolve-Path -LiteralPath trusted-signer/scripts/verify_trusted_script_set.py).Path
          $descriptor = (Resolve-Path -LiteralPath trusted-signer/trusted-signer-scripts.json).Path
          & $env:TRUSTED_PYTHON $verifier --root $root --descriptor $descriptor
          if ($LASTEXITCODE -ne 0) { throw "trusted signing script hash verification failed" }
      - name: Download fixed verified evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.trusted_signer.outputs.unsigned_evidence_artifact_name }}
          path: unsigned-evidence
      - name: Verify cross-job evidence digest before direct signing
        shell: pwsh
        run: |
          $script = (Resolve-Path -LiteralPath trusted-signer/scripts/evidence_artifact.py).Path
          & $env:TRUSTED_PYTHON $script verify --directory unsigned-evidence --kind unsigned --expected-digest $env:UNSIGNED_EVIDENCE_SHA256
          if ($LASTEXITCODE -ne 0) { throw "cross-job unsigned evidence verification failed" }
          Copy-Item -LiteralPath unsigned-evidence -Destination signed-evidence -Recurse
      - name: Sign only verified evidence with the protected supplier key
        shell: pwsh
        env:
          VISION_SUPPLIER_PRIVATE_KEY_PEM: ${{ secrets.VISION_SUPPLIER_PRIVATE_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VISION_SUPPLIER_PRIVATE_KEY_PEM)) { throw "supplier private key is required" }
          $key = Join-Path $env:RUNNER_TEMP "supplier-ed25519.pem"
          $script = (Resolve-Path -LiteralPath trusted-signer/scripts/sign_candidate_evidence.py).Path
          $primaryFailure = $null
          $cleanupFailure = $null
          try {
            [IO.File]::WriteAllText($key, $env:VISION_SUPPLIER_PRIVATE_KEY_PEM)
            & $env:TRUSTED_PYTHON $script --candidate-dir signed-evidence --private-key $key --signer-identity $env:VISION_SUPPLIER_SIGNER_IDENTITY --openssl $env:TRUSTED_OPENSSL
            if ($LASTEXITCODE -ne 0) { throw "installed evidence signing failed" }
          } catch {
            $primaryFailure = $_
          } finally {
            try {
              Remove-Item -LiteralPath $key -Force -ErrorAction Stop
              if (Test-Path -LiteralPath $key -PathType Leaf) { throw "supplier private key cleanup did not remove the key" }
            } catch {
              $cleanupFailure = $_
            }
          }
          if ($null -ne $primaryFailure) {
            if ($null -ne $cleanupFailure) { Write-Warning "supplier key cleanup failed after signing failure: $($cleanupFailure.Exception.Message)" }
            throw $primaryFailure
          }
          if ($null -ne $cleanupFailure) {
            throw $cleanupFailure
          }
      - name: Seal canonical direct signed evidence
        id: seal
        shell: pwsh
        run: |
          $script = (Resolve-Path -LiteralPath trusted-signer/scripts/evidence_artifact.py).Path
          $sealed = (& $env:TRUSTED_PYTHON $script seal --directory signed-evidence --kind signed) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $sealed.sha256 -notmatch '^[a-f0-9]{64}$') { throw "direct signed evidence sealing failed" }
          "signed_evidence_sha256=$($sealed.sha256)" >> $env:GITHUB_OUTPUT
      - name: Upload only direct supplier-signed evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identities.outputs.signed_evidence_artifact_name }}
          path: signed-evidence/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [verify, sign_evidence]
    runs-on: windows-latest
    environment: experimental-candidate
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release policy implementation
        uses: actions/checkout@v4
        with:
          repository: hbhjt/vending-vision
          ref: 59b4fee088db08f3008c137409f98577de987595
          path: trusted-policy
          persist-credentials: false
      - name: Checkout immutable hosted release authority
        uses: actions/checkout@v4
        with:
          repository: hbhjt/vending-vision
          ref: 41afbd9bd07b67df9f93de1dea1a9f9b0cea0228
          path: hosted-authority
          persist-credentials: false
      - name: Download attested candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release
      - name: Download supplier-signed evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sign_evidence.outputs.signed_evidence_artifact_name }}
          path: signed-evidence
      - name: Revalidate exact tag authority and sealed release evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SUBJECT_SHA256: ${{ needs.verify.outputs.subject_sha256 }}
          SIGNED_EVIDENCE_SHA256: ${{ needs.sign_evidence.outputs.signed_evidence_sha256 }}
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw "publish source commit is invalid" }
          if ($env:SOURCE_REF -notmatch '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+$') { throw "publish source ref is invalid" }
          if ($env:SUBJECT_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:SIGNED_EVIDENCE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw "publish evidence digest is invalid" }
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($python)) { throw "trusted system Python path is not absolute" }
          $trustedRoot = (Resolve-Path -LiteralPath trusted-policy).Path
          $scriptVerifier = (Resolve-Path -LiteralPath trusted-policy/scripts/verify_trusted_script_set.py).Path
          $scriptDescriptor = (Resolve-Path -LiteralPath trusted-policy/trusted-signer-scripts.json).Path
          & $python $scriptVerifier --root $trustedRoot --descriptor $scriptDescriptor
          if ($LASTEXITCODE -ne 0) { throw "trusted release policy script verification failed" }
          $evidenceVerifier = (Resolve-Path -LiteralPath trusted-policy/scripts/evidence_artifact.py).Path
          & $python $evidenceVerifier verify --directory signed-evidence --kind signed --expected-digest $env:SIGNED_EVIDENCE_SHA256
          if ($LASTEXITCODE -ne 0) { throw "signed release evidence verification failed" }
          $version = $env:SOURCE_REF -replace '^refs/tags/v',''
          $artifactFile = "vending-vision-$version-windows-x86_64.zip"
          $artifact = Join-Path $PWD "release/$artifactFile"
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "attested candidate artifact is missing" }
          $actualSubject = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSubject -cne $env:SUBJECT_SHA256) { throw "attested candidate subject changed before publish" }
          $supplier = Get-Content -LiteralPath signed-evidence/vision-artifact-attestation.json -Raw | ConvertFrom-Json
          $descriptor = Get-Content -LiteralPath signed-evidence/vision-release-descriptor.json -Raw | ConvertFrom-Json
          if ($supplier.attestedSubjectDigest -cne "sha256:$env:SUBJECT_SHA256" -or $supplier.approvedSourceCommit -cne $env:SOURCE_COMMIT -or $supplier.approvedSourceRef -cne $env:SOURCE_REF) { throw "supplier evidence authority mismatch" }
          if ($descriptor.bundle.digest -cne "sha256:$env:SUBJECT_SHA256" -or $descriptor.sourceApproval.commit -cne $env:SOURCE_COMMIT -or $descriptor.sourceApproval.ref -cne $env:SOURCE_REF -or $descriptor.sourceApproval.protectedMainAncestor -ne $true) { throw "installed evidence source authority mismatch" }
          git init --bare release-authority.git
          git --git-dir release-authority.git remote add origin https://github.com/hbhjt/vending-vision.git
          git --git-dir release-authority.git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          $commitRefspec = "+${env:SOURCE_COMMIT}:refs/trusted/source-commit"
          $tagRefspec = "+${env:SOURCE_REF}:${env:SOURCE_REF}"
          git --git-dir release-authority.git fetch --no-tags origin $commitRefspec
          git --git-dir release-authority.git fetch --no-tags origin $tagRefspec
          $sourcePolicy = (Resolve-Path -LiteralPath trusted-policy/scripts/approve_candidate_source.py).Path
          & $python $sourcePolicy --git-dir release-authority.git --source-commit $env:SOURCE_COMMIT --source-ref $env:SOURCE_REF --protected-main refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "release tag moved or source left protected main" }
          $releaseTag = $env:SOURCE_REF -replace '^refs/tags/',''
          $query = 'query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){id}}}'
          gh api graphql -f query=$query -F owner=hbhjt -F name=vending-vision -F tag=$releaseTag | Set-Content -LiteralPath release-admission.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw "release admission query failed" }
          $hostedAuthority = (Resolve-Path -LiteralPath hosted-authority/scripts/verify_hosted_release_authority.py).Path
          & $python $hostedAuthority --release-query release-admission.json --mode publish-admission --repository hbhjt/vending-vision --source-ref $env:SOURCE_REF --source-commit $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "release tag name was already published" }
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "RELEASE_TARGET=$env:SOURCE_COMMIT" >> $env:GITHUB_ENV
      - name: Publish immutable prerelease only after trusted signing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item -Path (Join-Path $PWD "signed-evidence/*") -Destination release/
          gh release create $env:RELEASE_TAG release/* --target $env:RELEASE_TARGET --prerelease --verify-tag --title "Vending Vision $env:RELEASE_TAG" --notes "Built by immutable trusted builder 691b5056e8b9bf2667bc527b2170780b05863946; independently verified, source-approved and supplier-signed with immutable trusted signer scripts 59b4fee088db08f3008c137409f98577de987595."
          if ($LASTEXITCODE -ne 0) { throw "immutable candidate release failed" }
          gh api "/repos/hbhjt/vending-vision/releases/tags/$env:RELEASE_TAG" --jq '{tagName:.tag_name,targetCommitish:.target_commitish,isDraft:.draft,isPrerelease:.prerelease}' | Set-Content -LiteralPath release-complete.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw "published release identity query failed" }
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $hostedAuthority = (Resolve-Path -LiteralPath hosted-authority/scripts/verify_hosted_release_authority.py).Path
          & $python $hostedAuthority --release-query release-complete.json --mode publish-complete --repository hbhjt/vending-vision --source-ref "refs/tags/$env:RELEASE_TAG" --source-commit $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw "published release identity fence failed" }
