name: 发布实验性视觉候选版本

on:
  push:
    tags:
      - "v*.*.*-rc.*"

permissions:
  contents: write

jobs:
  candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: 校验受保护 RC 来源
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+$') { throw "Only SemVer RC tags may publish candidates" }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Candidate tag must point to merged main" }
          "VISION_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: 测试精确源码和模型
        shell: pwsh
        run: |
          python -m pip install -r requirements-packaging.txt
          python -m pytest -q
          python -c "from vision.model_manifest import verify_model_manifest; result=verify_model_manifest(); assert result['ok'], result"
      - name: 构建带版本的 Windows bundle
        shell: pwsh
        run: |
          python scripts/set_release_version.py $env:VISION_RELEASE_VERSION
          ./scripts/build_exe.ps1
          python scripts/verify_packaged_exe.py --expected-version $env:VISION_RELEASE_VERSION
          New-Item -ItemType Directory -Force candidate | Out-Null
          Compress-Archive -Path dist/vending-vision -DestinationPath candidate/vending-vision-$env:VISION_RELEASE_VERSION-windows-x86_64.zip -CompressionLevel Optimal
      - name: 生成并签署供应方证据
        shell: pwsh
        env:
          VISION_SUPPLIER_PRIVATE_KEY_PEM: ${{ secrets.VISION_SUPPLIER_PRIVATE_KEY_PEM }}
          VISION_SUPPLIER_SIGNER_IDENTITY: ${{ secrets.VISION_SUPPLIER_SIGNER_IDENTITY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VISION_SUPPLIER_PRIVATE_KEY_PEM)) { throw "VISION_SUPPLIER_PRIVATE_KEY_PEM is required" }
          if ($env:VISION_SUPPLIER_SIGNER_IDENTITY -notmatch '^spki-sha256:[a-f0-9]{64}$') { throw "VISION_SUPPLIER_SIGNER_IDENTITY is invalid" }
          $key = Join-Path $env:RUNNER_TEMP supplier-ed25519.pem
          [IO.File]::WriteAllText($key, $env:VISION_SUPPLIER_PRIVATE_KEY_PEM)
          openssl pkey -in $key -pubout -out "$env:RUNNER_TEMP/supplier-public.pem"
          openssl pkey -pubin -in "$env:RUNNER_TEMP/supplier-public.pem" -outform DER -out "$env:RUNNER_TEMP/supplier-public.der"
          $actual = "spki-sha256:" + (Get-FileHash "$env:RUNNER_TEMP/supplier-public.der" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:VISION_SUPPLIER_SIGNER_IDENTITY) { throw "supplier key identity mismatch" }
          $bundle = Get-ChildItem candidate/vending-vision-*-windows-x86_64.zip | Select-Object -First 1
          python scripts/generate_candidate_evidence.py --bundle $bundle.FullName --version $env:VISION_RELEASE_VERSION --commit "${{ github.sha }}" --repository "${{ github.repository }}" --signer-identity $actual --output candidate
          Get-ChildItem candidate/*.json | ForEach-Object {
            openssl pkeyutl -sign -rawin -inkey $key -in $_.FullName -out ($_.FullName + ".sig")
          }
          Remove-Item $key -Force
      - uses: actions/upload-artifact@v4
        with:
          name: vending-vision-${{ env.VISION_RELEASE_VERSION }}-candidate
          path: candidate/*
          if-no-files-found: error
      - name: 发布不可变 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" candidate/* --prerelease --verify-tag --title "Vending Vision $env:VISION_RELEASE_VERSION" --notes "Experimental Vision Candidate Release. VEM conformance and approval must be run manually against the exact bundle digest."
