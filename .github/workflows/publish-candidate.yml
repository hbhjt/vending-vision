name: 发布实验性视觉候选版本

on:
  push:
    tags:
      - "v*.*.*-rc.*"

permissions:
  contents: write

jobs:
  candidate:
    runs-on: windows-latest
    environment: experimental-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: 校验受保护 RC 来源
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+$') { throw "Only SemVer RC tags may publish candidates" }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Candidate tag must point to merged main" }
          "VISION_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: 下载、校验并安全展开核心 wheel 闭包
        shell: pwsh
        env:
          CORE_WHEELHOUSE_URL: ${{ vars.CORE_WHEELHOUSE_URL }}
          CORE_WHEELHOUSE_SHA256: ${{ vars.CORE_WHEELHOUSE_SHA256 }}
        run: |
          if ($env:CORE_WHEELHOUSE_URL -notmatch '^https://') { throw "CORE_WHEELHOUSE_URL must be HTTPS" }
          if ($env:CORE_WHEELHOUSE_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw "CORE_WHEELHOUSE_SHA256 is required" }
          python scripts/download_verified_archive.py --url $env:CORE_WHEELHOUSE_URL --sha256 $env:CORE_WHEELHOUSE_SHA256 --destination wheelhouse
      - name: 从仓库锁定清单下载并校验 AI worker wheel 闭包
        shell: pwsh
        run: |
          python scripts/materialize_ai_wheelhouse.py --descriptor requirements-ai.lock.json --runtime-descriptor ai-runtime-descriptor.json --destination ai-wheelhouse
          python scripts/verify_ai_wheelhouse.py --descriptor requirements-ai.lock.json --wheelhouse ai-wheelhouse --runtime-descriptor ai-runtime-descriptor.json --requirements-output build/requirements-ai-release.txt
      - name: 离线安装、校验精确源码和模型
        shell: pwsh
        run: |
          python -m pip install --no-index --find-links wheelhouse --require-hashes -r requirements.txt
          python -m pip install --no-index --find-links ai-wheelhouse --require-hashes -r build/requirements-ai-release.txt
          python scripts/dependency_lock.py --wheelhouse wheelhouse --python python --target-sys-platform win32
          python scripts/verify_ai_wheelhouse.py --descriptor requirements-ai.lock.json --wheelhouse ai-wheelhouse --runtime-descriptor ai-runtime-descriptor.json --requirements-output build/requirements-ai-release.txt
          python -m pytest -q
          python -c "from vision.model_manifest import verify_model_manifest; result=verify_model_manifest(); assert result['ok'], result"
      - name: 构建带版本的 Windows bundle
        shell: pwsh
        run: |
          python scripts/set_release_version.py $env:VISION_RELEASE_VERSION
          ./scripts/build_exe.ps1 -Wheelhouse (Join-Path $PWD "wheelhouse") -AiWheelhouse (Join-Path $PWD "ai-wheelhouse") -AiWheelhouseDescriptor (Join-Path $PWD "requirements-ai.lock.json")
          New-Item -ItemType Directory -Force candidate | Out-Null
          $artifact = "candidate/vending-vision-$env:VISION_RELEASE_VERSION-windows-x86_64.zip"
          Compress-Archive -Path dist/vending-vision,dist/vending-vision-ai-worker -DestinationPath $artifact -CompressionLevel Optimal
          $manifest = "candidate/vending-vision-$env:VISION_RELEASE_VERSION-windows-x86_64.manifest.json"
          $manifestDigest = (python scripts/candidate_artifact_manifest.py --dist-root dist --artifact $artifact --output $manifest).Trim()
          if ($manifestDigest -notmatch '^[a-f0-9]{64}$') { throw "candidate manifest digest missing" }
          python scripts/verify_packaged_exe.py dist/vending-vision/vending-vision.exe --require-ai-worker --candidate-manifest $manifest --candidate-artifact $artifact --expected-candidate-manifest-sha256 $manifestDigest
          "VISION_CANDIDATE_MANIFEST=$manifest" >> $env:GITHUB_ENV
          "VISION_CANDIDATE_MANIFEST_SHA256=$manifestDigest" >> $env:GITHUB_ENV
      - name: 生成并签署供应方证据
        shell: pwsh
        env:
          VISION_SUPPLIER_PRIVATE_KEY_PEM: ${{ secrets.VISION_SUPPLIER_PRIVATE_KEY_PEM }}
          VISION_SUPPLIER_SIGNER_IDENTITY: ${{ vars.VISION_SUPPLIER_SIGNER_IDENTITY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VISION_SUPPLIER_PRIVATE_KEY_PEM)) { throw "VISION_SUPPLIER_PRIVATE_KEY_PEM is required" }
          if ($env:VISION_SUPPLIER_SIGNER_IDENTITY -notmatch '^spki-sha256:[a-f0-9]{64}$') { throw "VISION_SUPPLIER_SIGNER_IDENTITY is invalid" }
          $key = Join-Path $env:RUNNER_TEMP supplier-ed25519.pem
          try {
            [IO.File]::WriteAllText($key, $env:VISION_SUPPLIER_PRIVATE_KEY_PEM)
            $bundle = Get-ChildItem candidate/vending-vision-*-windows-x86_64.zip | Select-Object -First 1
            python scripts/generate_candidate_evidence.py --bundle $bundle.FullName --candidate-manifest $env:VISION_CANDIDATE_MANIFEST --version $env:VISION_RELEASE_VERSION --commit "${{ github.sha }}" --repository "${{ github.repository }}" --signer-identity $env:VISION_SUPPLIER_SIGNER_IDENTITY --requirements-lock requirements.txt --wheelhouse wheelhouse --python python --output candidate
            python scripts/sign_candidate_evidence.py --candidate-dir candidate --private-key $key --signer-identity $env:VISION_SUPPLIER_SIGNER_IDENTITY
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: vending-vision-${{ env.VISION_RELEASE_VERSION }}-candidate
          path: candidate/*
          if-no-files-found: error
      - name: 发布不可变 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" candidate/* --prerelease --verify-tag --title "Vending Vision $env:VISION_RELEASE_VERSION" --notes "Experimental Vision Candidate Release. Built independently by Vision. VEM conformance and approval run downstream against this exact tag and bundle digest."
