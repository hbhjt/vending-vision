name: 发布实验性视觉候选版本

on:
  push:
    tags:
      - "v*.*.*-rc.*"

permissions:
  contents: read

jobs:
  trusted_builder:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: hbhjt/vending-vision/.github/workflows/trusted-ai-candidate-builder.yml@691b5056e8b9bf2667bc527b2170780b05863946
    with:
      source_commit: ${{ github.sha }}
      core_wheelhouse_url: ${{ vars.CORE_WHEELHOUSE_URL }}
      core_wheelhouse_sha256: ${{ vars.CORE_WHEELHOUSE_SHA256 }}
      core_wheelhouse_bytes: ${{ fromJSON(vars.CORE_WHEELHOUSE_BYTES) }}

  publish:
    needs: trusted_builder
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Checkout immutable exact4 verifier
        uses: actions/checkout@v4
        with:
          repository: hbhjt/vending-vision
          ref: 691b5056e8b9bf2667bc527b2170780b05863946
          path: trusted-builder
          persist-credentials: false
      - name: Download exactly the trusted builder artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.trusted_builder.outputs.artifact_name }}
          path: candidate-input
      - name: Reverify exact4 trusted candidate inputs in production
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_FILE: ${{ needs.trusted_builder.outputs.artifact_file }}
          SUBJECT_SHA256: ${{ needs.trusted_builder.outputs.subject_sha256 }}
          MANIFEST_SHA256: ${{ needs.trusted_builder.outputs.manifest_sha256 }}
          ATTESTATION_BUNDLE_SHA256: ${{ needs.trusted_builder.outputs.attestation_bundle_sha256 }}
          CANDIDATE_COMMIT: ${{ github.sha }}
          CANDIDATE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:ARTIFACT_FILE -notmatch '^vending-vision-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+-windows-x86_64\.zip$') { throw "candidate artifact file output is invalid" }
          if ($env:SUBJECT_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:MANIFEST_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:ATTESTATION_BUNDLE_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:CANDIDATE_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:CANDIDATE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+$') { throw "candidate identity output is invalid" }
          $inputRoot = (Resolve-Path -LiteralPath candidate-input).Path
          $artifact = Join-Path $inputRoot $env:ARTIFACT_FILE
          $bundle = Join-Path $inputRoot "github-build-provenance.sigstore.json"
          gh attestation verify $artifact --bundle $bundle --repo "hbhjt/vending-vision" --signer-workflow "hbhjt/vending-vision/.github/workflows/trusted-ai-candidate-builder.yml" --signer-digest "691b5056e8b9bf2667bc527b2170780b05863946" --deny-self-hosted-runners
          if ($LASTEXITCODE -ne 0) { throw "trusted builder attestation verification failed" }
          python trusted-builder/scripts/verify_trusted_candidate_inputs.py --artifact $artifact --candidate-manifest (Join-Path $inputRoot "candidate-manifest.json") --github-attestation $bundle --trusted-builder-evidence (Join-Path $inputRoot "trusted-builder-evidence.json") --destination (Join-Path $PWD "verified-candidate") --subject-sha256 $env:SUBJECT_SHA256 --manifest-sha256 $env:MANIFEST_SHA256 --attestation-bundle-sha256 $env:ATTESTATION_BUNDLE_SHA256 --source-commit $env:CANDIDATE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "exact4 trusted candidate input verification failed" }
      - name: Publish exactly the reverified builder assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ github.ref_name }}
          ARTIFACT_FILE: ${{ needs.trusted_builder.outputs.artifact_file }}
        run: |
          gh release create $env:CANDIDATE_TAG "candidate-input/$env:ARTIFACT_FILE" "candidate-input/candidate-manifest.json" "candidate-input/github-build-provenance.sigstore.json" "candidate-input/trusted-builder-evidence.json" --repo hbhjt/vending-vision --prerelease --verify-tag --title "Vending Vision $env:CANDIDATE_TAG" --notes "Built, fully packaged-verified, and OIDC-attested by immutable trusted builder 691b5056e8b9bf2667bc527b2170780b05863946."
          if ($LASTEXITCODE -ne 0) { throw "exact4 candidate release failed" }
