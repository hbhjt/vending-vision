name: 发布实验性视觉候选版本

on:
  push:
    tags:
      - "v*.*.*-rc.*"

permissions:
  contents: read

jobs:
  trusted_builder:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: hbhjt/vending-vision/.github/workflows/trusted-ai-candidate-builder.yml@be8fe434855b94f61511e8c6c926e02c54230a38
    with:
      source_commit: ${{ github.sha }}
      core_wheelhouse_url: ${{ vars.CORE_WHEELHOUSE_URL }}
      core_wheelhouse_sha256: ${{ vars.CORE_WHEELHOUSE_SHA256 }}
      core_wheelhouse_bytes: ${{ fromJSON(vars.CORE_WHEELHOUSE_BYTES) }}

  verify:
    needs: trusted_builder
    runs-on: windows-latest
    permissions:
      contents: read
      attestations: read
    outputs:
      artifact_name: ${{ needs.trusted_builder.outputs.artifact_name }}
      artifact_file: ${{ needs.trusted_builder.outputs.artifact_file }}
      subject_sha256: ${{ needs.trusted_builder.outputs.subject_sha256 }}
      manifest_sha256: ${{ needs.trusted_builder.outputs.manifest_sha256 }}
      attestation_bundle_file: ${{ needs.trusted_builder.outputs.attestation_bundle_file }}
      attestation_bundle_sha256: ${{ needs.trusted_builder.outputs.attestation_bundle_sha256 }}
      builder_evidence_file: ${{ needs.trusted_builder.outputs.builder_evidence_file }}
    steps:
      - name: Checkout immutable verifier implementation
        uses: actions/checkout@v4
        with:
          repository: hbhjt/vending-vision
          ref: be8fe434855b94f61511e8c6c926e02c54230a38
          path: trusted-verifier
          persist-credentials: false
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          repository: hbhjt/vending-vision
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.trusted_builder.outputs.artifact_name }}
          path: candidate-input
      - name: Verify trusted reusable-builder provenance before extraction
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_FILE: ${{ needs.trusted_builder.outputs.artifact_file }}
          ATTESTATION_BUNDLE_FILE: ${{ needs.trusted_builder.outputs.attestation_bundle_file }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if ($env:ARTIFACT_FILE -notmatch '^vending-vision-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+-windows-x86_64\.zip$') { throw "candidate artifact file output is invalid" }
          if ($env:ATTESTATION_BUNDLE_FILE -cne "github-build-provenance.sigstore.json") { throw "attestation bundle file output is invalid" }
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:SOURCE_REF -notmatch '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+$') { throw "candidate source event identity is invalid" }
          $artifact = Join-Path $PWD "candidate-input/$env:ARTIFACT_FILE"
          $bundle = Join-Path $PWD "candidate-input/$env:ATTESTATION_BUNDLE_FILE"
          gh attestation verify $artifact --bundle $bundle --repo "hbhjt/vending-vision" --signer-workflow "hbhjt/vending-vision/.github/workflows/trusted-ai-candidate-builder.yml" --signer-digest "be8fe434855b94f61511e8c6c926e02c54230a38" --source-ref $env:SOURCE_REF --source-digest $env:SOURCE_COMMIT --deny-self-hosted-runners
          if ($LASTEXITCODE -ne 0) { throw "trusted builder attestation verification failed" }
      - uses: actions/setup-python@v5
        with:
          python-version-file: source/.python-version
      - name: Safely extract and run the full candidate verifier
        shell: pwsh
        env:
          CORE_WHEELHOUSE_URL: ${{ vars.CORE_WHEELHOUSE_URL }}
          CORE_WHEELHOUSE_SHA256: ${{ vars.CORE_WHEELHOUSE_SHA256 }}
          CORE_WHEELHOUSE_BYTES: ${{ vars.CORE_WHEELHOUSE_BYTES }}
          ARTIFACT_FILE: ${{ needs.trusted_builder.outputs.artifact_file }}
          SUBJECT_SHA256: ${{ needs.trusted_builder.outputs.subject_sha256 }}
          MANIFEST_SHA256: ${{ needs.trusted_builder.outputs.manifest_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if ($env:ARTIFACT_FILE -notmatch '^vending-vision-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+-windows-x86_64\.zip$') { throw "candidate artifact file output is invalid" }
          if ($env:SUBJECT_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:MANIFEST_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw "candidate verifier output identity is invalid" }
          python trusted-verifier/scripts/download_verified_archive.py --url $env:CORE_WHEELHOUSE_URL --sha256 $env:CORE_WHEELHOUSE_SHA256 --expected-bytes $env:CORE_WHEELHOUSE_BYTES --destination verifier-wheelhouse
          if ($LASTEXITCODE -ne 0) { throw "verifier wheelhouse materialization failed" }
          python -m venv .venv-candidate-verifier
          $VerifyPython = Join-Path $PWD ".venv-candidate-verifier\Scripts\python.exe"
          & $VerifyPython -m pip install --disable-pip-version-check --no-index --find-links verifier-wheelhouse --require-hashes -r source/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "verifier dependency install failed" }
          $artifact = Join-Path $PWD "candidate-input/$env:ARTIFACT_FILE"
          & $VerifyPython trusted-verifier/scripts/verify_packaged_exe.py --require-ai-worker --candidate-artifact $artifact --trusted-subject-sha256 $env:SUBJECT_SHA256 --expected-embedded-manifest-sha256 $env:MANIFEST_SHA256 --expected-source-commit $env:SOURCE_COMMIT --extract-root (Join-Path $PWD "verified-candidate")
          if ($LASTEXITCODE -ne 0) { throw "fresh candidate verification failed" }

  trusted_signer:
    needs: verify
    permissions:
      contents: read
      attestations: read
    uses: hbhjt/vending-vision/.github/workflows/trusted-ai-candidate-signer.yml@222c55385c3ddae58247a8911f5c3c441f0cb290
    with:
      source_commit: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      artifact_name: ${{ needs.verify.outputs.artifact_name }}
      subject_sha256: ${{ needs.verify.outputs.subject_sha256 }}
      manifest_sha256: ${{ needs.verify.outputs.manifest_sha256 }}
      attestation_bundle_sha256: ${{ needs.verify.outputs.attestation_bundle_sha256 }}

  publish:
    needs: [verify, trusted_signer]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release policy implementation
        uses: actions/checkout@v4
        with:
          repository: hbhjt/vending-vision
          ref: 222c55385c3ddae58247a8911f5c3c441f0cb290
          path: trusted-policy
          persist-credentials: false
      - name: Download attested candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release
      - name: Download supplier-signed evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.trusted_signer.outputs.signed_evidence_artifact_name }}
          path: signed-evidence
      - name: Revalidate exact tag authority and sealed release evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SUBJECT_SHA256: ${{ needs.verify.outputs.subject_sha256 }}
          SIGNED_EVIDENCE_SHA256: ${{ needs.trusted_signer.outputs.signed_evidence_sha256 }}
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw "publish source commit is invalid" }
          if ($env:SOURCE_REF -notmatch '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+$') { throw "publish source ref is invalid" }
          if ($env:SUBJECT_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:SIGNED_EVIDENCE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw "publish evidence digest is invalid" }
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($python)) { throw "trusted system Python path is not absolute" }
          $trustedRoot = (Resolve-Path -LiteralPath trusted-policy).Path
          $scriptVerifier = (Resolve-Path -LiteralPath trusted-policy/scripts/verify_trusted_script_set.py).Path
          $scriptDescriptor = (Resolve-Path -LiteralPath trusted-policy/trusted-signer-scripts.json).Path
          & $python $scriptVerifier --root $trustedRoot --descriptor $scriptDescriptor
          if ($LASTEXITCODE -ne 0) { throw "trusted release policy script verification failed" }
          $evidenceVerifier = (Resolve-Path -LiteralPath trusted-policy/scripts/evidence_artifact.py).Path
          & $python $evidenceVerifier verify --directory signed-evidence --kind signed --expected-digest $env:SIGNED_EVIDENCE_SHA256
          if ($LASTEXITCODE -ne 0) { throw "signed release evidence verification failed" }
          $version = $env:SOURCE_REF -replace '^refs/tags/v',''
          $artifactFile = "vending-vision-$version-windows-x86_64.zip"
          $artifact = Join-Path $PWD "release/$artifactFile"
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "attested candidate artifact is missing" }
          $actualSubject = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSubject -cne $env:SUBJECT_SHA256) { throw "attested candidate subject changed before publish" }
          $supplier = Get-Content -LiteralPath signed-evidence/vision-artifact-attestation.json -Raw | ConvertFrom-Json
          $descriptor = Get-Content -LiteralPath signed-evidence/vision-release-descriptor.json -Raw | ConvertFrom-Json
          if ($supplier.attestedSubjectDigest -cne "sha256:$env:SUBJECT_SHA256" -or $supplier.approvedSourceCommit -cne $env:SOURCE_COMMIT -or $supplier.approvedSourceRef -cne $env:SOURCE_REF) { throw "supplier evidence authority mismatch" }
          if ($descriptor.bundle.digest -cne "sha256:$env:SUBJECT_SHA256" -or $descriptor.sourceApproval.commit -cne $env:SOURCE_COMMIT -or $descriptor.sourceApproval.ref -cne $env:SOURCE_REF -or $descriptor.sourceApproval.protectedMainAncestor -ne $true) { throw "installed evidence source authority mismatch" }
          git init --bare release-authority.git
          git --git-dir release-authority.git remote add origin https://github.com/hbhjt/vending-vision.git
          git --git-dir release-authority.git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          $commitRefspec = "+${env:SOURCE_COMMIT}:refs/trusted/source-commit"
          $tagRefspec = "+${env:SOURCE_REF}:${env:SOURCE_REF}"
          git --git-dir release-authority.git fetch --no-tags origin $commitRefspec
          git --git-dir release-authority.git fetch --no-tags origin $tagRefspec
          $sourcePolicy = (Resolve-Path -LiteralPath trusted-policy/scripts/approve_candidate_source.py).Path
          & $python $sourcePolicy --git-dir release-authority.git --source-commit $env:SOURCE_COMMIT --source-ref $env:SOURCE_REF --protected-main refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "release tag moved or source left protected main" }
          gh api --paginate --slurp -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" "/repos/hbhjt/vending-vision/rulesets?targets=tag&includes_parents=true&per_page=100" | Set-Content -LiteralPath release-tag-rulesets.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw "release tag ruleset API unavailable" }
          $tagPolicy = (Resolve-Path -LiteralPath trusted-policy/scripts/verify_release_tag_ruleset.py).Path
          & $python $tagPolicy --rulesets release-tag-rulesets.json --repository hbhjt/vending-vision --source-ref $env:SOURCE_REF
          if ($LASTEXITCODE -ne 0) { throw "release tag is not immutable by policy" }
          $releaseTag = $env:SOURCE_REF -replace '^refs/tags/',''
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "RELEASE_TARGET=$env:SOURCE_COMMIT" >> $env:GITHUB_ENV
      - name: Publish immutable prerelease only after trusted signing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item -Path (Join-Path $PWD "signed-evidence/*") -Destination release/
          gh release create $env:RELEASE_TAG release/* --target $env:RELEASE_TARGET --prerelease --verify-tag --title "Vending Vision $env:RELEASE_TAG" --notes "Built by immutable trusted builder be8fe434855b94f61511e8c6c926e02c54230a38; independently verified, source-approved and supplier-signed by immutable trusted signer 222c55385c3ddae58247a8911f5c3c441f0cb290."
          if ($LASTEXITCODE -ne 0) { throw "immutable candidate release failed" }
