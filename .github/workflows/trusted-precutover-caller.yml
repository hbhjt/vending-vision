name: Run trusted Windows pre-cutover proof

on:
  workflow_dispatch:
    inputs:
      candidate_archive_url:
        description: Immutable candidate ZIP URL
        required: true
        type: string
      candidate_archive_sha256:
        description: Candidate ZIP SHA-256
        required: true
        type: string
      candidate_archive_bytes:
        description: Candidate ZIP byte size
        required: true
        type: number
      candidate_manifest_url:
        description: Immutable candidate manifest URL
        required: true
        type: string
      candidate_manifest_sha256:
        description: Candidate manifest SHA-256
        required: true
        type: string
      candidate_manifest_bytes:
        description: Candidate manifest byte size
        required: true
        type: number
      candidate_attestation_url:
        description: Immutable candidate attestation URL
        required: true
        type: string
      candidate_attestation_sha256:
        description: Candidate attestation SHA-256
        required: true
        type: string
      candidate_attestation_bytes:
        description: Candidate attestation byte size
        required: true
        type: number
      candidate_evidence_url:
        description: Immutable trusted-builder evidence URL
        required: true
        type: string
      candidate_evidence_sha256:
        description: Trusted-builder evidence SHA-256
        required: true
        type: string
      candidate_evidence_bytes:
        description: Trusted-builder evidence byte size
        required: true
        type: number
      model_pack_url:
        description: Optional immutable complete model-pack URL
        required: false
        type: string
      model_pack_sha256:
        description: Reconstructed model-pack SHA-256
        required: true
        type: string
      model_pack_bytes:
        description: Reconstructed model-pack byte size
        required: true
        type: number
      model_pack_part_01_url:
        description: Immutable model-pack part 01 URL
        required: false
        type: string
      model_pack_part_01_sha256:
        description: Model-pack part 01 SHA-256
        required: false
        type: string
      model_pack_part_01_bytes:
        description: Model-pack part 01 byte size
        required: false
        type: number
      model_pack_part_02_url:
        description: Immutable model-pack part 02 URL
        required: false
        type: string
      model_pack_part_02_sha256:
        description: Model-pack part 02 SHA-256
        required: false
        type: string
      model_pack_part_02_bytes:
        description: Model-pack part 02 byte size
        required: false
        type: number
      model_pack_part_03_url:
        description: Immutable model-pack part 03 URL
        required: false
        type: string
      model_pack_part_03_sha256:
        description: Model-pack part 03 SHA-256
        required: false
        type: string
      model_pack_part_03_bytes:
        description: Model-pack part 03 byte size
        required: false
        type: number

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  companion_builder:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: hbhjt/vending-vision/.github/workflows/trusted-precutover-companion-builder.yml@852ca005c5ce0fcdf7799f38d2335ae94c49be3c
    with:
      core_wheelhouse_url: ${{ vars.CORE_WHEELHOUSE_URL }}
      core_wheelhouse_sha256: ${{ vars.CORE_WHEELHOUSE_SHA256 }}
      core_wheelhouse_bytes: ${{ fromJSON(vars.CORE_WHEELHOUSE_BYTES) }}

  trusted_proof:
    needs: companion_builder
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: hbhjt/vending-vision/.github/workflows/trusted-precutover-companion-proof.yml@0e5a06eb840f316c0137a36c2f1d2ba9af9f2dc9
    with:
      proof_inputs: ${{ format('{{"candidate_archive_url":{0},"candidate_archive_sha256":{1},"candidate_archive_bytes":{2},"candidate_manifest_url":{3},"candidate_manifest_sha256":{4},"candidate_manifest_bytes":{5},"candidate_attestation_url":{6},"candidate_attestation_sha256":{7},"candidate_attestation_bytes":{8},"candidate_evidence_url":{9},"candidate_evidence_sha256":{10},"candidate_evidence_bytes":{11},"model_pack_url":{12},"model_pack_sha256":{13},"model_pack_bytes":{14},"model_pack_part_01_url":{15},"model_pack_part_01_sha256":{16},"model_pack_part_01_bytes":{17},"model_pack_part_02_url":{18},"model_pack_part_02_sha256":{19},"model_pack_part_02_bytes":{20},"model_pack_part_03_url":{21},"model_pack_part_03_sha256":{22},"model_pack_part_03_bytes":{23}}}', toJSON(inputs.candidate_archive_url), toJSON(inputs.candidate_archive_sha256), toJSON(fromJSON(inputs.candidate_archive_bytes)), toJSON(inputs.candidate_manifest_url), toJSON(inputs.candidate_manifest_sha256), toJSON(fromJSON(inputs.candidate_manifest_bytes)), toJSON(inputs.candidate_attestation_url), toJSON(inputs.candidate_attestation_sha256), toJSON(fromJSON(inputs.candidate_attestation_bytes)), toJSON(inputs.candidate_evidence_url), toJSON(inputs.candidate_evidence_sha256), toJSON(fromJSON(inputs.candidate_evidence_bytes)), toJSON(inputs.model_pack_url || ''), toJSON(inputs.model_pack_sha256), toJSON(fromJSON(inputs.model_pack_bytes)), toJSON(inputs.model_pack_part_01_url || ''), toJSON(inputs.model_pack_part_01_sha256 || ''), toJSON(fromJSON(inputs.model_pack_part_01_bytes || '0')), toJSON(inputs.model_pack_part_02_url || ''), toJSON(inputs.model_pack_part_02_sha256 || ''), toJSON(fromJSON(inputs.model_pack_part_02_bytes || '0')), toJSON(inputs.model_pack_part_03_url || ''), toJSON(inputs.model_pack_part_03_sha256 || ''), toJSON(fromJSON(inputs.model_pack_part_03_bytes || '0'))) }}
      companion_builder_outputs: ${{ toJSON(needs.companion_builder.outputs) }}
